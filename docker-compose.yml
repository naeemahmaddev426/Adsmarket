name: adsmarket

services:

  # ─── PHP Application (adsmarket) ────────────────────────────────────────────
  adsmarket:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: adsmarket
    restart: unless-stopped
    user: "www-data"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - adsmarket_network
    depends_on:
      - adsmarket_db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: adsmarket_db
      DB_PORT: 3306
      DB_DATABASE: adsmarket
      DB_USERNAME: adsmarket_user
      DB_PASSWORD: adsmarket_pass

  # ─── Nginx Web Server ────────────────────────────────────────────────────────
  adsmarket_nginx:
    image: nginx:1.25-alpine
    container_name: adsmarket_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - adsmarket_network
    depends_on:
      - adsmarket

  # ─── MySQL Database ───────────────────────────────────────────────────────────
  adsmarket_db:
    image: mysql:8.0
    container_name: adsmarket_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: adsmarket
      MYSQL_USER: adsmarket_user
      MYSQL_PASSWORD: adsmarket_pass
    volumes:
      - adsmarket_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - adsmarket_network
    command: --default-authentication-plugin=mysql_native_password

  # ─── phpMyAdmin ──────────────────────────────────────────────────────────────
  adsmarket_phpmyadmin:
    image: phpmyadmin:5.2
    container_name: adsmarket_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: adsmarket_db
      PMA_PORT: 3306
      PMA_USER: adsmarket_user
      PMA_PASSWORD: adsmarket_pass
      MYSQL_ROOT_PASSWORD: root_secret
    networks:
      - adsmarket_network
    depends_on:
      - adsmarket_db

# ─── Networks & Volumes ──────────────────────────────────────────────────────
networks:
  adsmarket_network:
    driver: bridge

volumes:
  adsmarket_db_data:
    driver: local
